[project]
name = "ace-minimax-h3"
version = "0.1.1"
description = "MiniMax H3 Dify-parity tools through Ace Data Cloud for ComfyUI"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "jsonschema>=4,<5"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/AceDataCloud/MiniMaxH3ComfyUI"
Documentation = "https://github.com/AceDataCloud/MiniMaxH3ComfyUI#readme"
"Bug Tracker" = "https://github.com/AceDataCloud/MiniMaxH3ComfyUI/issues"

[tool.comfy]
PublisherId = "acedatacloud"
DisplayName = "MiniMax H3 by Ace Data Cloud"
Icon = "https://raw.githubusercontent.com/AceDataCloud/MiniMaxH3ComfyUI/main/assets/logo-400.png"
